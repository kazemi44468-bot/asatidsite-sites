<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="پایگاه شخصی دکتر علی کاظمی">
  <meta name="theme-color" content="#f5f1e8">
  <title>دکتر علی کاظمی | پایگاه شخصی</title>
  <style>
    /* ===== IMPORTS ===== */
    @import url('https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@300;400;600;700&display=swap');

    /* ===== RESET ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      font-family: 'Noto Naskh Arabic', 'AsatidVazirmatn', Arial, sans-serif;
      background: #f5f1e8;
    }

    /* ===== INTRO CONTAINER ===== */
    .intro {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      position: relative;
      background: radial-gradient(ellipse at 30% 20%, #f8f4ec, #e8e2d6 70%, #d9d2c4);
      overflow: hidden;
    }

    /* ===== ANIMATED ORNAMENTS ===== */
    .intro-ornaments {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .intro-ornaments i {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(177, 138, 74, 0.06) 0%, transparent 70%);
      animation: floatOrnament 30s infinite alternate ease-in-out;
    }

    .intro-ornaments i:nth-child(1) {
      width: 600px;
      height: 600px;
      top: -15%;
      right: -10%;
      animation-delay: 0s;
    }

    .intro-ornaments i:nth-child(2) {
      width: 500px;
      height: 500px;
      bottom: -15%;
      left: -10%;
      animation-delay: -8s;
      background: radial-gradient(circle, rgba(49, 95, 125, 0.05) 0%, transparent 70%);
    }

    .intro-ornaments i:nth-child(3) {
      width: 300px;
      height: 300px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation-delay: -16s;
      background: radial-gradient(circle, rgba(177, 138, 74, 0.04) 0%, transparent 70%);
    }

    @keyframes floatOrnament {
      0% {
        transform: translate(0, 0) scale(1) rotate(0deg);
      }
      100% {
        transform: translate(30px, -40px) scale(1.08) rotate(5deg);
      }
    }

    /* ===== GOLD SPARKLES ===== */
    .sparkle {
      position: fixed;
      width: 4px;
      height: 4px;
      background: #b18a4a;
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(177, 138, 74, 0.3);
      animation: sparkleAnim 4s infinite alternate;
      pointer-events: none;
      z-index: 0;
    }

    .sparkle:nth-child(1) {
      top: 12%;
      left: 8%;
      animation-delay: 0.2s;
    }

    .sparkle:nth-child(2) {
      bottom: 18%;
      right: 6%;
      animation-delay: 1.4s;
      width: 6px;
      height: 6px;
    }

    .sparkle:nth-child(3) {
      top: 25%;
      right: 18%;
      animation-delay: 2.8s;
      width: 3px;
      height: 3px;
    }

    .sparkle:nth-child(4) {
      bottom: 30%;
      left: 12%;
      animation-delay: 0.8s;
    }

    @keyframes sparkleAnim {
      0% {
        opacity: 0.2;
        transform: scale(0.8);
      }
      100% {
        opacity: 1;
        transform: scale(1.4);
      }
    }

    /* ===== MAIN CARD ===== */
    .intro-layout {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 580px;
      padding: 48px 36px 56px;
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(24px) saturate(1.2);
      -webkit-backdrop-filter: blur(24px) saturate(1.2);
      border-radius: 56px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow:
        0 40px 100px rgba(42, 57, 68, 0.08),
        0 12px 40px rgba(42, 57, 68, 0.04),
        inset 0 1px 0 rgba(255, 255, 255, 0.8);
      animation: cardEntrance 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(40px) scale(0.96);
    }

    @keyframes cardEntrance {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* ===== DECORATIVE RING ===== */
    .intro-ring {
      position: absolute;
      inset: -8px;
      border-radius: 60px;
      border: 1px solid rgba(177, 138, 74, 0.10);
      pointer-events: none;
      animation: ringPulse 6s infinite alternate;
    }

    .intro-ring::after {
      content: '';
      position: absolute;
      inset: 12px;
      border-radius: 52px;
      border: 1px solid rgba(177, 138, 74, 0.06);
    }

    @keyframes ringPulse {
      0% {
        opacity: 0.3;
        transform: scale(0.98);
      }
      100% {
        opacity: 1;
        transform: scale(1.02);
      }
    }

    /* ===== PORTRAIT ===== */
    .intro-portrait {
      position: relative;
      margin-top: -80px;
      margin-bottom: 16px;
    }

    .intro-portrait-frame {
      width: 156px;
      height: 156px;
      border-radius: 50%;
      padding: 6px;
      background: linear-gradient(135deg, #b18a4a, #c9a86a, #b18a4a);
      box-shadow:
        0 16px 48px rgba(177, 138, 74, 0.20),
        0 0 0 8px rgba(177, 138, 74, 0.04);
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    .intro-portrait-frame:hover {
      transform: scale(1.04);
      box-shadow:
        0 24px 64px rgba(177, 138, 74, 0.25),
        0 0 0 12px rgba(177, 138, 74, 0.06);
    }

    .intro-portrait-image {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #d4cfc4 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="38" r="22" fill="%23b5ada0"/><circle cx="50" cy="90" r="38" fill="%23b5ada0"/></svg>') center/cover no-repeat;
      background-size: 60%;
      background-position: center 38%;
      border: 4px solid rgba(255, 255, 255, 0.9);
      transition: transform 0.6s ease;
    }

    .intro-portrait-frame:hover .intro-portrait-image {
      transform: scale(1.02);
    }

    /* ===== GLOW EFFECT ===== */
    .intro-portrait-glow {
      position: absolute;
      inset: -30px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(177, 138, 74, 0.08), transparent 70%);
      pointer-events: none;
      animation: glowPulse 4s infinite alternate;
    }

    @keyframes glowPulse {
      0% {
        opacity: 0.4;
        transform: scale(1);
      }
      100% {
        opacity: 1;
        transform: scale(1.12);
      }
    }

    /* ===== BADGE ===== */
    .intro-badge {
      position: absolute;
      bottom: 4px;
      right: -4px;
      background: linear-gradient(135deg, #315f7d, #1a3a4f);
      color: #fff;
      font-size: 0.5rem;
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 300;
      letter-spacing: 0.5px;
      border: 2px solid #fff;
      box-shadow: 0 4px 12px rgba(49, 95, 125, 0.20);
      white-space: nowrap;
    }

    /* ===== PROFILE THUMBS ===== */
    .intro-profile-gallery {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 16px;
    }

    .profile-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: none;
      background: rgba(49, 95, 125, 0.12);
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      padding: 0;
      position: relative;
    }

    .profile-thumb::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 1px solid transparent;
      transition: all 0.4s ease;
    }

    .profile-thumb.active {
      background: linear-gradient(135deg, #b18a4a, #c9a86a);
      transform: scale(1.3);
      box-shadow: 0 0 20px rgba(177, 138, 74, 0.25);
    }

    .profile-thumb.active::after {
      border-color: rgba(177, 138, 74, 0.15);
    }

    .profile-thumb:hover {
      transform: scale(1.2);
      background: #315f7d;
    }

    .profile-thumb span {
      display: none;
    }

    /* ===== SIGNATURE ===== */
    .intro-signature {
      text-align: center;
      margin: 8px 0 2px;
      line-height: 1.6;
      color: #315f7d;
    }

    .intro-signature .sig-name {
      display: block;
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 400;
      letter-spacing: 1px;
      color: #1a3a4f;
    }

    .intro-signature .sig-personal {
      font-size: 0.55em;
      font-weight: 300;
      opacity: 0.5;
      display: block;
      margin-bottom: 2px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #b18a4a;
    }

    .intro-signature .sig-doctor {
      font-weight: 300;
      opacity: 0.7;
      font-size: 0.85em;
    }

    .intro-signature .sig-name-main {
      font-weight: 700;
      display: inline;
      background: linear-gradient(135deg, #1a3a4f, #315f7d);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ===== SUBTITLE ===== */
    .intro-subtitle {
      text-align: center;
      font-size: clamp(0.75rem, 1.2vw, 0.9rem);
      color: #4a6a7f;
      opacity: 0.7;
      margin: 4px 0 14px;
      font-weight: 300;
      letter-spacing: 0.5px;
      padding-top: 12px;
      position: relative;
    }

    .intro-subtitle::before {
      content: '✦';
      color: #b18a4a;
      margin-left: 8px;
      font-size: 0.7rem;
      opacity: 0.5;
    }

    .intro-subtitle::after {
      content: '✦';
      color: #b18a4a;
      margin-right: 8px;
      font-size: 0.7rem;
      opacity: 0.5;
    }

    /* ===== DIVIDER ===== */
    .intro-title-rule {
      width: 80px;
      height: 2px;
      margin: 6px auto 20px;
      background: linear-gradient(90deg, transparent, #b18a4a, #c9a86a, #b18a4a, transparent);
      border-radius: 4px;
      opacity: 0.4;
      position: relative;
    }

    .intro-title-rule::after {
      content: '◆';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #b18a4a;
      font-size: 0.5rem;
      opacity: 0.4;
      background: rgba(255, 255, 255, 0.6);
      padding: 0 8px;
    }

    .intro-title-rule i {
      display: none;
    }

    /* ===== ENTER BUTTON ===== */
    .intro-enter {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-width: 140px;
      height: 50px;
      padding: 0 36px;
      background: linear-gradient(135deg, #ffffff, #f5f7f9);
      border: 1.5px solid rgba(177, 138, 74, 0.25);
      border-radius: 60px;
      color: #1a3a4f;
      font-size: 0.8rem;
      font-weight: 500;
      text-decoration: none;
      letter-spacing: 1px;
      box-shadow:
        0 6px 20px rgba(42, 57, 68, 0.04),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .intro-enter::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 60px;
      background: linear-gradient(135deg, #b18a4a, #c9a86a, #b18a4a);
      opacity: 0;
      z-index: -1;
      transition: opacity 0.5s ease;
    }

    .intro-enter::after {
      content: '→';
      font-size: 1.1rem;
      transition: transform 0.4s ease;
    }

    .intro-enter:hover {
      border-color: #b18a4a;
      box-shadow:
        0 12px 36px rgba(177, 138, 74, 0.12),
        0 0 0 6px rgba(177, 138, 74, 0.04);
      transform: translateY(-3px) scale(1.02);
      color: #b18a4a;
    }

    .intro-enter:hover::after {
      transform: translateX(-4px);
    }

    .intro-enter:hover::before {
      opacity: 1;
    }

    .intro-enter:active {
      transform: translateY(0) scale(0.97);
    }

    /* ===== GALLERY SLIDER (hidden) ===== */
    .intro-gallery {
      display: none;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 640px) {
      .intro-layout {
        padding: 32px 20px 40px;
        border-radius: 36px;
        max-width: 100%;
        margin: 10px;
      }

      .intro-portrait-frame {
        width: 120px;
        height: 120px;
      }

      .intro-portrait {
        margin-top: -64px;
      }

      .intro-signature .sig-name {
        font-size: 1.4rem;
      }

      .intro-subtitle {
        font-size: 0.7rem;
        padding-top: 8px;
      }

      .intro-enter {
        height: 44px;
        min-width: 110px;
        font-size: 0.72rem;
        padding: 0 24px;
      }

      .intro-enter::after {
        font-size: 0.9rem;
      }

      .intro-profile-gallery {
        gap: 8px;
        margin-top: 12px;
      }

      .profile-thumb {
        width: 12px;
        height: 12px;
      }

      .intro-badge {
        font-size: 0.4rem;
        padding: 3px 10px;
        bottom: 2px;
        right: -2px;
      }

      .intro-title-rule {
        width: 60px;
        margin: 4px auto 16px;
      }
    }

    @media (max-width: 400px) {
      .intro-layout {
        padding: 24px 14px 32px;
        border-radius: 28px;
      }

      .intro-portrait-frame {
        width: 100px;
        height: 100px;
      }

      .intro-portrait {
        margin-top: -52px;
      }

      .intro-signature .sig-name {
        font-size: 1.1rem;
      }

      .intro-enter {
        height: 38px;
        min-width: 90px;
        font-size: 0.65rem;
        padding: 0 16px;
      }

      .intro-profile-gallery {
        gap: 6px;
        margin-top: 10px;
      }

      .profile-thumb {
        width: 10px;
        height: 10px;
      }

      .intro-subtitle {
        font-size: 0.6rem;
      }
    }
  </style>
</head>
<body>
  <main class="intro">
    <!-- Ornaments -->
    <div class="intro-ornaments" aria-hidden="true">
      <i></i>
      <i></i>
      <i></i>
    </div>

    <!-- Sparkles -->
    <div class="sparkle" aria-hidden="true"></div>
    <div class="sparkle" aria-hidden="true"></div>
    <div class="sparkle" aria-hidden="true"></div>
    <div class="sparkle" aria-hidden="true"></div>

    <!-- Main Card -->
    <section class="intro-layout">
      <div class="intro-ring" aria-hidden="true"></div>

      <!-- Portrait -->
      <article class="intro-portrait">
        <div class="intro-portrait-frame">
          <div class="intro-portrait-image" role="img" aria-label="عکس اختصاصی استاد"></div>
          <div class="intro-portrait-glow"></div>
        </div>
        <span class="intro-badge">PhD</span>

        <div class="intro-profile-gallery" aria-label="تصاویر پروفایل">
          <button class="profile-thumb active" type="button" aria-label="تصویر اول"><span></span></button>
          <button class="profile-thumb" type="button" aria-label="تصویر دوم"><span></span></button>
          <button class="profile-thumb" type="button" aria-label="تصویر سوم"><span></span></button>
        </div>
      </article>

      <!-- Signature -->
      <div class="intro-signature" aria-label="پایگاه شخصی دکتر علی کاظمی">
        <span class="sig-name">
          <span class="sig-personal">پایگاه شخصی</span>
          <span class="sig-doctor">دکتر</span>
          <span class="sig-name-main">علی کاظمی</span>
        </span>
      </div>

      <!-- Subtitle -->
      <div class="intro-subtitle">
        پژوهشگر · مدرس دانشگاه · هوش مصنوعی و علوم داده
      </div>

      <!-- Divider -->
      <div class="intro-title-rule" aria-hidden="true">
        <i></i>
      </div>

      <!-- Enter Button -->
      <a class="intro-enter" href="../../master/home.html">ورود به پایگاه</a>
    </section>
  </main>

  <script src="../../master/intro.js"></script>
</body>
</html>
