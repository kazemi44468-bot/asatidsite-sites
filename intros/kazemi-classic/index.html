<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="پایگاه شخصی دکتر علی کاظمی">
  <meta name="theme-color" content="#f5f1e8">
  <title>دکتر علی کاظمی | پایگاه شخصی</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@300;400;600;700&display=swap');

    :root {
      --cream: #f5f1e8;
      --cream-light: #fbf8f2;
      --gold: #b18a4a;
      --gold-light: #d2b47a;
      --navy: #1a3a4f;
      --blue: #315f7d;
      --text-soft: #4a6a7f;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { min-height: 100%; background: var(--cream); }

    body {
      min-height: 100svh;
      font-family: 'Noto Naskh Arabic', Tahoma, Arial, sans-serif;
      background: var(--cream);
      color: var(--navy);
      overflow-x: hidden;
    }

    .intro {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      isolation: isolate;
      padding: clamp(22px, 5vh, 56px) clamp(14px, 4vw, 32px);
      background: radial-gradient(ellipse at 30% 18%, #faf7f0 0%, #e8e2d6 66%, #d9d2c4 100%);
      overflow: hidden;
    }

    .intro-ornaments,
    .intro-sparkles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: -1; }

    .intro-ornaments i {
      position: absolute;
      display: block;
      border-radius: 50%;
      filter: blur(1px);
      animation: floatOrnament 24s ease-in-out infinite alternate;
    }

    .intro-ornaments i:nth-child(1) {
      width: min(58vw, 600px); height: min(58vw, 600px);
      top: -18%; right: -12%;
      background: radial-gradient(circle, rgba(177,138,74,.09), transparent 68%);
    }

    .intro-ornaments i:nth-child(2) {
      width: min(52vw, 520px); height: min(52vw, 520px);
      bottom: -18%; left: -13%; animation-delay: -8s;
      background: radial-gradient(circle, rgba(49,95,125,.07), transparent 68%);
    }

    .intro-ornaments i:nth-child(3) {
      width: min(30vw, 320px); height: min(30vw, 320px);
      top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: -15s;
      background: radial-gradient(circle, rgba(177,138,74,.05), transparent 70%);
    }

    @keyframes floatOrnament {
      from { transform: translate3d(0,0,0) scale(1); }
      to { transform: translate3d(24px,-30px,0) scale(1.07); }
    }

    .sparkle {
      position: absolute;
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 14px rgba(177,138,74,.35);
      animation: sparkleAnim 4s ease-in-out infinite alternate;
    }

    .sparkle:nth-child(1) { top: 12%; left: 8%; }
    .sparkle:nth-child(2) { top: 25%; right: 18%; width: 3px; height: 3px; animation-delay: 1.2s; }
    .sparkle:nth-child(3) { bottom: 18%; right: 7%; width: 6px; height: 6px; animation-delay: 2s; }
    .sparkle:nth-child(4) { bottom: 30%; left: 12%; animation-delay: .6s; }

    @keyframes sparkleAnim {
      from { opacity: .2; transform: scale(.7); }
      to { opacity: .95; transform: scale(1.35); }
    }

    .intro-layout {
      width: min(100%, 580px);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: clamp(54px, 7vw, 68px) clamp(18px, 6vw, 42px) clamp(30px, 5vw, 46px);
      border: 1px solid rgba(255,255,255,.68);
      border-radius: clamp(30px, 6vw, 56px);
      background: rgba(255,255,255,.56);
      backdrop-filter: blur(24px) saturate(1.15);
      -webkit-backdrop-filter: blur(24px) saturate(1.15);
      box-shadow: 0 35px 90px rgba(42,57,68,.10), 0 12px 35px rgba(42,57,68,.05), inset 0 1px 0 rgba(255,255,255,.9);
      animation: cardEntrance .9s cubic-bezier(.16,1,.3,1) both;
    }

    @keyframes cardEntrance {
      from { opacity: 0; transform: translateY(30px) scale(.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .intro-ring {
      position: absolute;
      inset: -8px;
      border: 1px solid rgba(177,138,74,.11);
      border-radius: inherit;
      pointer-events: none;
      animation: ringPulse 6s ease-in-out infinite alternate;
    }

    .intro-ring::after {
      content: '';
      position: absolute;
      inset: 12px;
      border: 1px solid rgba(177,138,74,.055);
      border-radius: inherit;
    }

    @keyframes ringPulse {
      from { opacity: .35; transform: scale(.99); }
      to { opacity: 1; transform: scale(1.012); }
    }

    .intro-portrait {
      position: relative;
      width: clamp(128px, 27vw, 174px);
      aspect-ratio: 1;
      margin-top: clamp(-92px, -9vw, -68px);
      margin-bottom: clamp(12px, 2vw, 18px);
    }

    .intro-portrait-glow {
      position: absolute;
      inset: -24px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(177,138,74,.13), transparent 68%);
      animation: glowPulse 4s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes glowPulse {
      from { opacity: .4; transform: scale(.96); }
      to { opacity: 1; transform: scale(1.08); }
    }

    .intro-portrait-frame {
      position: relative;
      width: 100%; height: 100%;
      padding: 6px;
      border-radius: 50%;
      background: linear-gradient(135deg, #9b7336, #d8bc83 45%, #b18a4a 70%, #e0c990);
      box-shadow: 0 18px 48px rgba(177,138,74,.23), 0 0 0 8px rgba(177,138,74,.055);
      transition: transform .45s ease, box-shadow .45s ease;
    }

    .intro-portrait-frame:hover {
      transform: translateY(-3px) scale(1.035);
      box-shadow: 0 24px 58px rgba(177,138,74,.28), 0 0 0 12px rgba(177,138,74,.065);
    }

    .intro-portrait-image {
      display: block;
      width: 100%; height: 100%;
      border-radius: 50%;
      object-fit: cover;
      object-position: center 25%;
      border: 4px solid rgba(255,255,255,.94);
      background: #d4cfc4;
      transition: transform .55s ease;
    }

    .intro-portrait-frame:hover .intro-portrait-image { transform: scale(1.025); }

    .intro-badge {
      position: absolute;
      right: -3px;
      bottom: 5px;
      z-index: 3;
      padding: 4px 11px 5px;
      border: 2px solid #fff;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--blue), var(--navy));
      color: #fff;
      font-size: clamp(.52rem, 1.6vw, .66rem);
      font-weight: 600;
      line-height: 1;
      white-space: nowrap;
      box-shadow: 0 6px 16px rgba(49,95,125,.2);
    }

    .intro-profile-gallery {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin: 4px 0 7px;
      direction: ltr;
    }

    .profile-thumb {
      width: 34px; height: 34px;
      padding: 2px;
      border: 2px solid rgba(255,255,255,.9);
      border-radius: 50%;
      overflow: hidden;
      background: #ddd;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(26,58,79,.08);
      transition: transform .3s ease, border-color .3s ease, box-shadow .3s ease;
    }

    .profile-thumb img {
      display: block;
      width: 100%; height: 100%;
      border-radius: 50%;
      object-fit: cover;
      object-position: center 24%;
    }

    .profile-thumb.active {
      transform: scale(1.18);
      border-color: var(--gold);
      box-shadow: 0 0 0 4px rgba(177,138,74,.10), 0 6px 18px rgba(177,138,74,.18);
    }

    .profile-thumb:hover { transform: scale(1.12); border-color: var(--gold-light); }

    .intro-signature {
      text-align: center;
      margin: 4px 0 0;
      line-height: 1.45;
    }

    .sig-personal {
      display: block;
      margin-bottom: 1px;
      color: var(--gold);
      font-size: clamp(.56rem, 1.8vw, .7rem);
      font-weight: 600;
      letter-spacing: 3px;
    }

    .sig-name {
      display: block;
      color: var(--navy);
      font-size: clamp(1.7rem, 5.5vw, 2.55rem);
      font-weight: 400;
    }

    .sig-doctor { font-size: .8em; font-weight: 300; opacity: .72; }

    .sig-name-main {
      font-weight: 700;
      background: linear-gradient(135deg, var(--navy), var(--blue));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .intro-subtitle {
      max-width: 92%;
      margin: 7px 0 12px;
      padding-top: 11px;
      color: var(--text-soft);
      text-align: center;
      font-size: clamp(.74rem, 2.2vw, .91rem);
      font-weight: 400;
      line-height: 1.9;
      opacity: .8;
    }

    .intro-subtitle::before,
    .intro-subtitle::after {
      color: var(--gold);
      font-size: .7rem;
      opacity: .65;
    }

    .intro-subtitle::before { content: '✦'; margin-left: 8px; }
    .intro-subtitle::after { content: '✦'; margin-right: 8px; }

    .intro-title-rule {
      width: min(110px, 30vw);
      height: 2px;
      margin: 2px auto 20px;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, var(--gold), var(--gold-light), var(--gold), transparent);
      opacity: .5;
      position: relative;
    }

    .intro-title-rule::after {
      content: '◆';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      padding: 0 7px;
      background: rgba(255,255,255,.62);
      color: var(--gold);
      font-size: .45rem;
    }

    .intro-enter {
      width: min(100%, 280px);
      min-height: 54px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      padding: 0 28px;
      border: 1px solid rgba(255,255,255,.82);
      border-radius: 999px;
      background: linear-gradient(135deg, #1a3a4f, #315f7d);
      color: #fff;
      text-decoration: none;
      font-size: clamp(.82rem, 2.5vw, .96rem);
      font-weight: 600;
      box-shadow: 0 12px 30px rgba(26,58,79,.18), inset 0 1px 0 rgba(255,255,255,.18);
      transition: transform .3s ease, box-shadow .3s ease, background .3s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .intro-enter::before {
      content: '↗';
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 27px; height: 27px;
      border-radius: 50%;
      background: rgba(255,255,255,.13);
      border: 1px solid rgba(255,255,255,.2);
      font-size: 1rem;
      line-height: 1;
    }

    .intro-enter:hover {
      transform: translateY(-3px);
      box-shadow: 0 17px 36px rgba(26,58,79,.24), 0 0 0 5px rgba(177,138,74,.08);
      background: linear-gradient(135deg, #315f7d, #1a3a4f);
    }

    .intro-enter:active { transform: translateY(-1px) scale(.99); }

    .intro-note {
      margin-top: 10px;
      color: var(--text-soft);
      font-size: clamp(.58rem, 1.8vw, .68rem);
      opacity: .5;
    }

    @media (max-width: 640px) {
      .intro { align-items: center; padding: 24px 12px; }
      .intro-layout { padding-top: 52px; border-radius: 34px; }
      .intro-portrait { margin-top: -74px; }
      .intro-enter { min-height: 52px; width: min(100%, 300px); }
      .intro-note { display: none; }
    }

    @media (max-width: 400px) {
      .intro { padding: 18px 9px; }
      .intro-layout { padding: 47px 15px 27px; border-radius: 28px; }
      .intro-portrait { width: 126px; margin-top: -67px; }
      .profile-thumb { width: 31px; height: 31px; }
      .intro-profile-gallery { gap: 7px; }
      .intro-subtitle { max-width: 100%; line-height: 1.75; }
      .intro-title-rule { margin-bottom: 16px; }
    }

    @media (max-height: 720px) and (min-width: 641px) {
      .intro { padding-top: 28px; padding-bottom: 28px; }
      .intro-layout { padding-top: 48px; padding-bottom: 28px; }
      .intro-portrait { width: 142px; margin-top: -70px; }
      .intro-subtitle { margin-bottom: 7px; }
      .intro-title-rule { margin-bottom: 13px; }
      .intro-enter { min-height: 48px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
<link rel="stylesheet" href="../../assets/css/site-standards.css"></head>
<body>
  <main class="intro">
    <div class="intro-ornaments" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="intro-sparkles" aria-hidden="true"><span class="sparkle"></span><span class="sparkle"></span><span class="sparkle"></span><span class="sparkle"></span></div>

    <section class="intro-layout" aria-label="معرفی پایگاه شخصی">
      <span class="intro-ring" aria-hidden="true"></span>

      <div class="intro-portrait">
        <span class="intro-portrait-glow" aria-hidden="true"></span>
        <div class="intro-portrait-frame">
          <img class="intro-portrait-image" src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=700&q=85" alt="تصویر پروفایل استاد">
          <span class="intro-badge">PhD</span>
        </div>
      </div>

      <div class="intro-profile-gallery" aria-label="نمونه تصاویر پروفایل">
        <button class="profile-thumb" type="button" aria-label="تصویر پروفایل دوم"><img src="https://images.unsplash.com/photo-1560250097-0b93528c311a?auto=format&fit=crop&w=180&q=80" alt=""></button>
        <button class="profile-thumb active" type="button" aria-label="تصویر پروفایل اصلی"><img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=180&q=80" alt=""></button>
        <button class="profile-thumb" type="button" aria-label="تصویر پروفایل سوم"><img src="https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?auto=format&fit=crop&w=180&q=80" alt=""></button>
      </div>

      <div class="intro-signature">
        <span class="sig-personal">پایگاه شخصی</span>
        <span class="sig-name"><span class="sig-doctor">دکتر</span> <span class="sig-name-main">علی کاظمی</span></span>
      </div>

      <p class="intro-subtitle">پژوهشگر · مدرس دانشگاه · هوش مصنوعی و علوم داده</p>
      <div class="intro-title-rule" aria-hidden="true"></div>

      <a class="intro-enter" href="../../master/home.html">ورود به پایگاه</a>
      <span class="intro-note">پایگاه شخصی و علمی استاد</span>
    </section>
  </main>
</body>
</html>
